name: Worker validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - name: Validate deployment bundle without publishing
        run: npx wrangler deploy --dry-run
      - name: Prepare synthetic local runtime
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs'
          import {randomBytes} from 'node:crypto'
          const config=`NEXTAUTH_SECRET=${randomBytes(48).toString('hex')}\nNEXTAUTH_URL=http://localhost:5193\nAUTH_ALLOWED_CHAIN_IDS=8453,84532,1\nREAD_ONLY=false\n`
          writeFileSync('.dev.vars',config,{mode:0o600,flag:'wx'})
          writeFileSync('dist/server/.dev.vars',config,{mode:0o600})
          JS
          npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - name: Test production workerd and browser
        run: |
          npm run start -- --host 127.0.0.1 --port 5193 > /tmp/w3rk-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          node --input-type=module <<'JS'
          for(let attempt=0;attempt<120;attempt++){
            try{const response=await fetch('http://localhost:5193/api/auth/csrf');if(response.ok)process.exit(0)}catch{}
            await new Promise(resolve=>setTimeout(resolve,500))
          }
          throw Error('Local Worker did not become ready')
          JS
          node scripts/smoke-local-auth.mjs
          node scripts/smoke-local-browser.mjs
